  <title>Dmitry Dronov — redirecting</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d14;
      color: #a9b4c2;
      font: 16px/1.5 Inter, Arial, sans-serif;
    }
    .loader {
      text-align: center;
      opacity: 0;
      animation: fadeIn 0.3s ease 0.2s forwards;
    }
    .spinner {
      width: 32px;
      height: 32px;
      margin: 0 auto 16px;
      border: 3px solid rgba(91,140,255,0.15);
      border-top-color: #5b8cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    p { margin: 0; font-size: 14px; }
    a { color: #5b8cff; text-decoration: underline; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Redirecting to the correct version for your location...</p>
    <p style="margin-top:12px;font-size:12px;color:#5b8cff;">
      <a href="index_world.html">World version</a> &middot;
      <a href="index_germ.html">German version</a>
    </p>
  </div>

  <script>
  (function () {
    // ── Country detection with redirect ──────────────────────────
    // index.html is the loader page. It detects the visitor's country
    // and redirects to the appropriate version:
    //   - DE / AT / LI  →  index_germ.html
    //   - all other     →  index_world.html

    var COUNTRY_KEY = 'detectedCountry';
    var cached = sessionStorage.getItem(COUNTRY_KEY);

    function redirect(page) {
      sessionStorage.setItem(COUNTRY_KEY, page === 'index_germ.html' ? 'de' : 'other');
      window.location.replace(page);
    }

    function fallback() {
      // If geo fails: use browser language as hint
      var lang = (navigator.language || navigator.languages?.[0] || 'en').slice(0, 2).toLowerCase();
      redirect(lang === 'de' ? 'index_germ.html' : 'index_world.html');
    }

    if (cached === 'de') {
      redirect('index_germ.html');
      return;
    }
    if (cached === 'other') {
      redirect('index_world.html');
      return;
    }

    // Use AbortController with a 3s timeout
    var controller = new AbortController();
    setTimeout(function () { controller.abort(); }, 3000);

    fetch('https://ipapi.co/json/', {
      signal: controller.signal,
      cache: 'force-cache'
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var code = (data.country_code || data.country || '').toUpperCase();
        if (['DE', 'AT', 'LI'].includes(code)) {
          redirect('index_germ.html');
        } else {
          redirect('index_world.html');
        }
      })
      .catch(function () {
        fallback();
      });
  })();
  </script>
</body>
